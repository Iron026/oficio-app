apply plugin: 'com.android.application'

android {
    namespace = "io.github.iron026.oficio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.iron026.oficio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode cresce a cada build do CI (permite atualizar sem desinstalar).
        versionCode Integer.parseInt((project.findProperty("oficioVersionCode") ?: "2").toString())
        versionName (project.findProperty("oficioVersionName") ?: "0.2.0").toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Assinatura de DEPURAÇÃO estável: no CI, a chave é derivada do segredo
    // OFICIO_DEBUG_SEED (ver ci/debug_keystore.py). Sem a variável, usa a
    // chave de depuração padrão do Android. Não é a chave de produção.
    signingConfigs {
        // Assinatura de RELEASE (0.5.0 estável): só por variáveis de ambiente preenchidas a partir de segredos
        // protegidos no CI (ver docs/RELEASE-0.5.0.md). Nenhuma chave ou senha fica no repositório. Sem as
        // variáveis, o release sai SEM assinatura (nunca com a chave de depuração).
        release {
            def releaseKeystore = System.getenv('OFICIO_RELEASE_KEYSTORE')
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType System.getenv('OFICIO_RELEASE_STORE_TYPE') ?: 'pkcs12'
                storePassword System.getenv('OFICIO_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('OFICIO_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('OFICIO_RELEASE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
        debug {
            def oficioKeystore = System.getenv('OFICIO_DEBUG_KEYSTORE')
            if (oficioKeystore) {
                storeFile file(oficioKeystore)
                storeType 'pkcs12'
                storePassword 'android'
                keyAlias 'oficio'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Não depurável e sem otimização de código (R8 desligado: mesmo comportamento validado na RC.1).
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('OFICIO_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
